<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1145px;height:838px;background:#FFFFFF;" width="1145px" height="838px" viewBox="0 0 1145 838" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="485.424" y="33.535" fill="#000" font-size="14" textLength="173.038" font-weight="700">Emails (REQ-004-9/10)</text></g><ellipse cx="441.22" cy="62.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="397.569,97.219,484.871,97.219,496.871,109.219,484.871,121.219,397.569,121.219,385.569,109.219,397.569,97.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="397.569" y="113.376" fill="#000" font-size="11" textLength="87.302">What happened?</text><text x="228.631" y="93.943" fill="#000" font-size="11" textLength="123.583">an employer submitted</text><text x="228.631" y="106.898" fill="#000" font-size="11" textLength="156.938">or resubmitted a listing (003)</text><text x="496.871" y="93.943" fill="#000" font-size="11" textLength="157.921">an Admin approved, rejected,</text><text x="496.871" y="106.898" fill="#000" font-size="11" textLength="154.118">took down or edited a listing</text><rect x="62.122" y="131.219" width="189.395" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="72.122" y="152.82" fill="#000" font-size="12" textLength="169.395">The submission is saved first</text><rect x="16" y="185.352" width="281.639" height="76.531" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="206.953" fill="#000" font-size="12" textLength="204.035">For every Admin except the person</text><text x="26" y="221.086" fill="#000" font-size="12" textLength="191.941">who submitted: send "A listing is</text><text x="26" y="235.219" fill="#000" font-size="12" textLength="202.377">waiting for approval" with the title,</text><text x="26" y="249.352" fill="#000" font-size="12" textLength="261.639">business, region and a link to its Admin view</text><rect x="32.846" y="345.36" width="247.947" height="62.398" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="42.846" y="366.962" fill="#000" font-size="12" textLength="162.58">The submission still stands.</text><text x="42.846" y="381.095" fill="#000" font-size="12" textLength="227.947">The listing is in the queue and counted</text><text x="42.846" y="395.228" fill="#000" font-size="12" textLength="107.631">on the Admin area</text><polygon points="102.421,296.883,211.218,296.883,223.218,308.883,211.218,320.883,102.421,320.883,90.421,308.883,102.421,296.883" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="160.819" y="331.518" fill="#000" font-size="11" textLength="13.583">no</text><text x="102.421" y="313.04" fill="#000" font-size="11" textLength="108.797">Email could be sent?</text><text x="223.218" y="306.563" fill="#000" font-size="11" textLength="17.483">yes</text><polygon points="156.819,432.236,168.819,444.236,156.819,456.236,144.819,444.236,156.819,432.236" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="156.819" cy="502.236" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="156.819" cy="502.236" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="639.949" y="131.219" width="171.342" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="649.949" y="152.82" fill="#000" font-size="12" textLength="151.342">The decision is saved first</text><rect x="626.862" y="233.829" width="197.516" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="636.862" y="255.431" fill="#000" font-size="12" textLength="177.516">No email — nobody is emailed</text><text x="636.862" y="269.563" fill="#000" font-size="12" textLength="131.49">about their own action</text><ellipse cx="725.62" cy="328.095" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="725.62" cy="328.095" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="650.148,185.352,801.092,185.352,813.092,197.352,801.092,209.352,650.148,209.352,638.148,197.352,650.148,185.352" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="729.62" y="219.986" fill="#000" font-size="11" textLength="17.483">yes</text><text x="650.148" y="201.509" fill="#000" font-size="11" textLength="150.944">The Admin owns the listing?</text><text x="813.092" y="195.031" fill="#000" font-size="11" textLength="13.583">no</text><polygon points="702.844,404.572,748.396,404.572,760.396,416.572,748.396,428.572,702.844,428.572,690.844,416.572,702.844,404.572" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="702.844" y="420.729" fill="#000" font-size="11" textLength="45.552">Decision</text><rect x="322.793" y="464.482" width="132.922" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="332.793" y="486.084" fill="#000" font-size="12" textLength="112.922">"Your listing is live"</text><rect x="475.715" y="464.482" width="185.943" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="485.715" y="486.084" fill="#000" font-size="12" textLength="165.943">"Your listing needs changes"</text><text x="485.715" y="500.217" fill="#000" font-size="12" textLength="90.023">with the reason</text><rect x="681.658" y="464.482" width="193.168" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="691.658" y="486.084" fill="#000" font-size="12" textLength="173.168">"Your listing was taken down"</text><text x="691.658" y="500.217" fill="#000" font-size="12" textLength="90.023">with the reason</text><rect x="892.266" y="464.482" width="233.621" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="902.266" y="486.084" fill="#000" font-size="12" textLength="135.68">"We edited your listing"</text><text x="902.266" y="500.217" fill="#000" font-size="12" textLength="213.621">with the names of the parts changed</text><polygon points="725.62,523.236,725.62,523.236,737.62,535.236,725.62,547.236,725.62,547.236,713.62,535.236,725.62,523.236" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="568.975" y="567.236" width="313.291" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="578.975" y="588.838" fill="#000" font-size="12" textLength="277.723">Send one email to the owner's account address,</text><text x="578.975" y="602.971" fill="#000" font-size="12" textLength="293.291">with the title and a link to the listing in My listings</text><rect x="598.77" y="683.979" width="253.701" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="608.77" y="705.581" fill="#000" font-size="12" textLength="233.701">The decision still stands. Tell the Admin</text><text x="608.77" y="719.714" fill="#000" font-size="12" textLength="202.975">the employer could not be emailed</text><polygon points="671.222,635.502,780.019,635.502,792.019,647.502,780.019,659.502,671.222,659.502,659.222,647.502,671.222,635.502" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="729.62" y="670.137" fill="#000" font-size="11" textLength="13.583">no</text><text x="671.222" y="651.659" fill="#000" font-size="11" textLength="108.797">Email could be sent?</text><text x="792.019" y="645.182" fill="#000" font-size="11" textLength="17.483">yes</text><polygon points="725.62,752.245,737.62,764.245,725.62,776.245,713.62,764.245,725.62,752.245" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="725.62" cy="807.245" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="725.62" cy="807.245" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="156.819" y1="165.352" x2="156.819" y2="185.352" style="stroke:#181818;stroke-width:1;"/><polygon points="152.819,175.352,156.819,185.352,160.819,175.352,156.819,179.352" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="156.819" y1="320.883" x2="156.819" y2="345.36" style="stroke:#181818;stroke-width:1;"/><polygon points="152.819,335.36,156.819,345.36,160.819,335.36,156.819,339.36" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="223.218" y1="308.883" x2="290.793" y2="308.883" style="stroke:#181818;stroke-width:1;"/><polygon points="286.793,366.56,290.793,376.56,294.793,366.56,290.793,370.56" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="290.793" y1="308.883" x2="290.793" y2="444.236" style="stroke:#181818;stroke-width:1;"/><line x1="290.793" y1="444.236" x2="168.819" y2="444.236" style="stroke:#181818;stroke-width:1;"/><polygon points="178.819,440.236,168.819,444.236,178.819,448.236,174.819,444.236" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="156.819" y1="407.759" x2="156.819" y2="432.236" style="stroke:#181818;stroke-width:1;"/><polygon points="152.819,422.236,156.819,432.236,160.819,422.236,156.819,426.236" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x