h d="M256.394,396.798 L256.394,428.419 L236.394,432.419 L256.394,436.419 L256.394,468.04 A0,0 0 0 0 256.394,468.04 L555.592,468.04 A0,0 0 0 0 555.592,468.04 L555.592,406.798 L545.592,396.798 L256.394,396.798 A0,0 0 0 0 256.394,396.798" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M545.592,396.798 L545.592,406.798 L555.592,406.798 L545.592,396.798" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="262.394" y="414.366" fill="#000" font-size="13" textLength="197.507">Salary: whole pesos per month,</text><text x="262.394" y="429.677" fill="#000" font-size="13" textLength="278.199">minimum ≥ ₱1,000, maximum ≥ minimum,</text><text x="262.394" y="444.987" fill="#000" font-size="13" textLength="160.056">maximum ≤ ₱1,000,000.</text><text x="262.394" y="460.298" fill="#000" font-size="13" textLength="120.459">Never "negotiable".</text><rect x="91.776" y="415.353" width="144.617" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="101.776" y="436.954" fill="#000" font-size="12" textLength="124.617">Show what is missing</text><ellipse cx="164.085" cy="499.04" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="164.085" cy="499.04" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="79.082,335.798,249.088,335.798,261.088,355.23,249.088,374.663,79.082,374.663,67.082,355.23,79.082,335.798" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="168.085" y="385.298" fill="#000" font-size="11" textLength="13.583">no</text><text x="79.082" y="346.433" fill="#000" font-size="11" textLength="55.752">Complete?</text><text x="79.082" y="359.388" fill="#000" font-size="11" textLength="170.006">Title, region, area, salary range,</text><text x="79.082" y="372.343" fill="#000" font-size="11" textLength="155.805">type, "About the job" all valid</text><text x="261.088" y="352.91" fill="#000" font-size="11" textLength="17.483">yes</text><rect x="68.116" y="600.518" width="191.938" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="78.116" y="622.119" fill="#000" font-size="12" textLength="171.938">Ask to choose another region</text><ellipse cx="164.085" cy="674.084" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="164.085" cy="674.084" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="94.497,552.04,233.673,552.04,245.673,564.04,233.673,576.04,94.497,576.04,82.497,564.04,94.497,552.04" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="168.085" y="586.675" fill="#000" font-size="11" textLength="13.583">no</text><text x="94.497" y="568.197" fill="#000" font-size="11" textLength="139.176">Chosen region still active?</text><text x="245.673" y="561.72" fill="#000" font-size="11" textLength="17.483">yes</text><rect x="37.814" y="777.472" width="252.541" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="47.814" y="799.073" fill="#000" font-size="12" textLength="178.875">Refuse — explain the limit and</text><text x="47.814" y="813.206" fill="#000" font-size="12" textLength="232.541">suggest closing or withdrawing a listing</text><ellipse cx="164.085" cy="857.627" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="164.085" cy="857.627" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="45.392,727.084,282.778,727.084,294.778,740.039,282.778,752.994,45.392,752.994,33.392,740.039,45.392,727.084" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="168.085" y="763.629" fill="#000" font-size="11" textLength="17.483">yes</text><text x="45.392" y="737.719" fill="#000" font-size="11" textLength="204.88">Employer with 3 open listings already?</text><text x="45.392" y="750.674" fill="#000" font-size="11" textLength="237.386">(Pending + Published; Admins have no limit)</text><text x="294.778" y="737.719" fill="#000" font-size="11" textLength="13.583">no</text><path d="M330.301,906.794 L330.301,930.76 L310.301,934.76 L330.301,938.76 L330.301,962.726 A0,0 0 0 0 330.301,962.726 L612.907,962.726 A0,0 0 0 0 612.907,962.726 L612.907,916.794 L602.907,906.794 L330.301,906.794 A0,0 0 0 0 330.301,906.794" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M602.907,906.794 L602.907,916.794 L612.907,916.794 L602.907,906.794" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="336.301" y="924.362" fill="#000" font-size="13" textLength="261.606">The listing keeps this copy. Changing the</text><text x="336.301" y="939.673" fill="#000" font-size="13" textLength="255.772">account's business details later does not</text><text x="336.301" y="954.983" fill="#000" font-size="13" textLength="224.142">alter a Pending or Published listing.</text><rect x="17.869" y="910.627" width="292.432" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="27.869" y="932.229" fill="#000" font-size="12" textLength="272.432">Copy the account's business name and "about"</text><text x="27.869" y="946.361" fill="#000" font-size="12" textLength="168.088">onto the listing (REQ-003-2)</text><rect x="76.056" y="982.726" width="176.059" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="86.056" y="1004.327" fill="#000" font-size="12" textLength="156.059">Status → Pending approval</text><rect x="57.625" y="1036.858" width="212.92" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="67.625" y="1058.46" fill="#000" font-size="12" textLength="192.92">Tell the employer: "An admin will</text><text x="67.625" y="1072.593" fill="#000" font-size="12" textLength="181.113">check it before it is published."</text><rect x="71.061" y="1105.124" width="186.049" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="81.061" y="1126.726" fill="#000" font-size="12" textLength="125.871">Listing appears in the</text><text x="81.061" y="1140.858" fill="#000" font-size="12" textLength="166.049">Admin approval queue (004)</text><path d="M309.356,1177.212 L309.356,1193.522 L289.356,1197.522 L309.356,1201.522 L309.356,1217.833 A0,0 0 0 0 309.356,1217.833 L518.253,1217.833 A0,0 0 0 0 518.253,1217.833 L518.253,1187.212 L508.253,1177.212 L309.356,1177.212 A0,0 0 0 0 309.356,1177.212" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M508.253,1177.212 L508.253,1187.212 L518.253,1187.212 L508.253,1177.212" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="315.356" y="1194.78" fill="#000" font-size="13" textLength="187.567">A failed email never stops the</text><text x="315.356" y="1210.091" fill="#000" font-size="13" textLength="187.897">submission and is not shown.</text><rect x="38.813" y="1173.39" width="250.543" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="48.813" y="1194.991" fill="#000" font-size="12" textLength="211.002">Every Admin except the submitter is</text><text x="48.813" y="1209.124" fill="#000" font-size="12" textLength="230.543">emailed that it is waiting (REQ-004-10)</text><ellipse cx="164.085" cy="1252.655" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="164.085" cy="1252.655" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="164.085" y1="72.488" x2="164.085" y2="92.488" style="stroke:#181818;stroke-width:1;"/><polygon points="160.085,82.488,164.085,92.488,168.085,82.488,164.085,86.488" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="164.085" y1="243.364" x2="164.085" y2="271.798" style="stroke:#181818;stroke-width:1;"/>