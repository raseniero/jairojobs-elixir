</text><text x="294.778" y="722.408" fill="#000" font-size="11" textLength="13.583">no</text><rect x="76.056" y="895.316" width="176.059" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="86.056" y="916.918" fill="#000" font-size="12" textLength="156.059">Status → Pending approval</text><rect x="57.625" y="949.449" width="212.92" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="67.625" y="971.051" fill="#000" font-size="12" textLength="192.92">Tell the employer: "An admin will</text><text x="67.625" y="985.184" fill="#000" font-size="12" textLength="161.725">check it before it goes live."</text><rect x="71.061" y="1017.715" width="186.049" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="81.061" y="1039.316" fill="#000" font-size="12" textLength="125.871">Listing appears in the</text><text x="81.061" y="1053.449" fill="#000" font-size="12" textLength="166.049">Admin approval queue (004)</text><ellipse cx="164.085" cy="1096.98" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="164.085" cy="1096.98" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="164.085" y1="72.488" x2="164.085" y2="92.488" style="stroke:#181818;stroke-width:1;"/><polygon points="160.085,82.488,164.085,92.488,168.085,82.488,164.085,86.488" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="164.085" y1="243.364" x2="164.085" y2="271.798" style="stroke:#181818;stroke-width:1;"/><polygon points="160.085,261.798,164.085,271.798,168.085,261.798,164.085,265.798" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="164.085" y1="184.754" x2="164.085" y2="209.231" style="stroke:#181818;stroke-width:1;"/><polygon points="160.085,199.231,164.085,209.231,168.085,199.231,164.085,203.231" fill="#1