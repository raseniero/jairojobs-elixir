ength="66.838">Any listings?</text><text x="240.496" y="210.434" fill="#000" font-size="11" textLength="17.483">yes</text><rect x="53.276" y="375.798" width="283.602" height="76.531" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="63.276" y="397.399" fill="#000" font-size="12" textLength="197.578">Show most recently changed first:</text><text x="63.276" y="411.532" fill="#000" font-size="12" textLength="263.602">title, region and salary (or "Not finished yet"),</text><text x="63.276" y="425.665" fill="#000" font-size="12" textLength="185.227">status label; Employers also see</text><text x="63.276" y="439.798" fill="#000" font-size="12" textLength="153.598">"x of 3 open listings used"</text><rect x="98.54" y="472.329" width="193.074" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="108.54" y="493.931" fill="#000" font-size="12" textLength="132.709">Employer taps a listing</text><text x="108.54" y="508.063" fill="#000" font-size="12" textLength="173.074">(or opens its address directly)</text><rect x="110.411" y="589.072" width="169.332" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="120.411" y="610.674" fill="#000" font-size="12" textLength="135.943">Not found — same as a</text><text x="120.411" y="624.807" fill="#000" font-size="12" textLength="149.332">listing that does not exist</text><ellipse cx="195.077" cy="669.705" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="195.077" cy="669.705" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="106.722,540.595,283.431,540.595,295.431,552.595,283.431,564.595,106.722,564.595,94.722,552.595,106.722,540.595" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="199.077" y="575.229" fill="#000" font-size="11" textLength="13.583">no</text><text x="106.722" y="556.752" fill