<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:859px;height:1200px;background:#FFFFFF;" width="859px" height="1200px" viewBox="0 0 859 1200" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="230.852" y="33.535" fill="#000" font-size="14" textLength="395.794" font-weight="700">A listing's address, and the links to it (REQ-005-6/10)</text></g><ellipse cx="414.249" cy="62.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="282.392" y="92.488" width="263.715" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="292.392" y="114.09" fill="#000" font-size="12" textLength="243.715">An Admin approves a listing (REQ-004-5)</text><rect x="286.631" y="146.621" width="255.236" height="62.398" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="296.631" y="168.223" fill="#000" font-size="12" textLength="235.236">Make the slug from the title as it is now:</text><text x="296.631" y="182.355" fill="#000" font-size="12" textLength="220.055">lowercase letters, digits and hyphens,</text><text x="296.631" y="196.488" fill="#000" font-size="12" textLength="126.967">at most 60 characters</text><rect x="293.252" y="279.407" width="241.994" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="303.252" y="301.009" fill="#000" font-size="12" textLength="221.994">Add the next free number: "barista-2"</text><polygon points="337.45,229.02,491.048,229.02,503.048,241.975,491.048,254.93,337.45,254.93,325.45,241.975,337.45,229.02" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="418.249" y="265.564" fill="#000" font-size="11" textLength="17.483">yes</text><text x="337.45" y="239.654" fill="#000" font-size="11" textLength="153.597">Another listing in this region</text><text x="337.45" y="252.609" fill="#000" font-size="11" textLength="115.822">already has that slug?</text><text x="503.048" y="239.654" fill="#000" font-size="11" textLength="13.583">no</text><polygon points="414.249,333.54,426.249,345.54,414.249,357.54,402.249,345.54,414.249,333.54" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="298.42" y="377.54" width="231.658" height="62.398" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="308.42" y="399.142" fill="#000" font-size="12" textLength="151.758">The public address is now</text><text x="308.42" y="413.274" fill="#000" font-size="12" textLength="211.658">/jobs/&lt;region slug>/&lt;listing slug></text><text x="308.42" y="427.407" fill="#000" font-size="12" textLength="205.09">and the listing is on the public lists</text><polygon points="338.777,459.938,489.721,459.938,501.721,471.938,489.721,483.938,338.777,483.938,326.777,471.938,338.777,459.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="338.777" y="476.096" fill="#000" font-size="11" textLength="150.944">The Admin owns the listing?</text><text x="309.294" y="469.618" fill="#000" font-size="11" textLength="17.483">yes</text><text x="501.721" y="469.618" fill="#000" font-size="11" textLength="13.583">no</text><rect x="212.802" y="493.938" width="150.74" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="222.802" y="515.54" fill="#000" font-size="12" textLength="130.74">No email (REQ-004-9)</text><rect x="383.542" y="493.938" width="313.566" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="393.542" y="515.54" fill="#000" font-size="12" textLength="293.566">"Your listing is live" email to the owner, with a link</text><text x="393.542" y="529.673" fill="#000" font-size="12" textLength="275.279">to the public page and a link to it in My listings</text><polygon points="414.249,548.204,426.249,560.204,414.249,572.204,402.249,560.204,414.249,548.204" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="257.75" y="592.204" width="312.998" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="267.75" y="613.806" fill="#000" font-size="12" textLength="260.32">While it is Live, the owner view (003) and the</text><text x="267.75" y="627.938" fill="#000" font-size="12" textLength="292.998">Admin view (004) each show "See the public page"</text><rect x="239.281" y="660.47" width="349.936" height="76.531" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="249.281" y="682.071" fill="#000" font-size="12" textLength="329.936">On the public page, the owner sees "This is your listing."</text><text x="249.281" y="696.204" fill="#000" font-size="12" textLength="273.621">with "Manage this listing" (if they can still open</text><text x="249.281" y="710.337" fill="#000" font-size="12" textLength="301.975">My listings). An Admin sees "Open the Admin view".</text><text x="249.281" y="724.47" fill="#000" font-size="12" textLength="138.621">Nobody else sees either</text><polygon points="324.917,801.001,503.581,801.001,515.581,813.001,503.581,825.001,324.917,825.001,312.917,813.001,324.917,801.001" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="324.917" y="817.158" fill="#000" font-size="11" textLength="178.664">What happens to the listing later?</text><rect x="16" y="881.911" width="223.42" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="903.513" fill="#000" font-size="12" textLength="203.42">The address stays exactly as it was</text><rect x="259.42" y="881.911" width="272.164" height="62.398" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="269.42" y="903.513" fill="#000" font-size="12" textLength="229.242">The address changes to the new region</text><text x="269.42" y="917.646" fill="#000" font-size="12" textLength="252.164">(same slug, or the next free number there).</text><text x="269.42" y="931.778" fill="#000" font-size="12" textLength="238.764">The old address forwards to the new one</text><rect x="551.584" y="881.911" width="260.914" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="561.584" y="903.513" fill="#000" font-size="12" textLength="158.578">The address stays as it was</text><text x="561.584" y="917.646" fill="#000" font-size="12" textLength="240.914">(a region's slug never changes, spec 002)</text><polygon points="414.249,967.2,414.249,967.2,426.249,979.2,414.249,991.2,414.249,991.2,402.249,979.2,414.249,967.2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="414.249,757.001,426.249,769.001,414.249,781.001,402.249,769.001,414.249,757.001" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="374.562,1011.2,453.936,1011.2,465.936,1023.2,453.936,1035.2,374.562,1035.2,362.562,1023.2,374.562,1011.2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="374.562" y="1027.357" fill="#000" font-size="11" textLength="79.374">Still Published?</text><text x="465.936" y="1020.88" fill="#000" font-size="11" textLength="17.483">yes</text><rect x="265.288" y="1076.476" width="297.922" height="62.398" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="275.288" y="1098.077" fill="#000" font-size="12" textLength="277.922">The address stays the listing's own and is never</text><text x="275.288" y="1112.21" fill="#000" font-size="12" textLength="218.959">given to another listing. It now shows</text><text x="275.288" y="1126.343" fill="#000" font-size="12" textLength="247.746">"This job is no longer listed." (REQ-005-7)</text><ellipse cx="414.249" cy="1169.874" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="414.249" cy="1169.874" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="414.249" y1="72.488" x2="414.249" y2="92.488" style="stroke:#181818;stroke-width:1;"/><polygon points="410.249,82.488,414.249,92.488,418.249,82.488,414.249,86.488" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="414.249" y1="126.621" x2="414.249" y2="146.621" style="stroke:#181818;stroke-width:1;"/><polygon points="410.249,136.621,414.249,146.621,418.249,136.621,414.249,140.621" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="414.249" y1="254.93" x2="414.249" y2="279.407" style="stroke:#181818;stroke-width:1;"/><polygon points="410.249,269.407,414.249,279.407,418.249,269.407,414.249,273.407" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="503.048" y1="241.975" x2="545.246" y2="241.975" style="stroke:#181818;stroke-width:1;"/><polygon points="541.246,285.996,545.246,295.996,549.246,285.996,545.246,289.996" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="545.246" y1="241.975" x2="545.246" y2="345.54" style="stroke:#181818;stroke-width:1;"/><line x1="545.246" y1="345.54" x2="426.249" y2="345.54" style="stroke:#181818;stroke-width:1;"/><polygon points="436.249,341.54,426.249,345.54,436.249,349.54,432.249,345.54" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="414.249" y1="313.54" x2="414.249" y2="333.54" style="stroke:#181818;stroke-width:1;"/><polygon points="410.249,323.54,414.249,333.54,418.249,323.54,414.249,327.54" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="414.249" y1="209.02" x2="414.249" y2="229.02" style="stroke:#181818;stroke-width:1;"/><polygon points="410.249,219.02,414.249,229.02,418.249,219.02,414.249,223.02" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="414.249" y1="357.54" x2="414.249" y2="377.54" style="stroke:#181818;stroke-width:1;"/><polygon points="410.249,367.54,414.249,377.54,418.249,367.54,414.249,371.54" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="326.777" y1="471.938" x2="288.172" y2="471.938" style="stroke:#181818;stroke-width:1;"/><line x1="288.172" y1="471.938" x2="288.172" y2="493.938" style="stroke:#181818;stroke-width:1;"/><polygon points="284.172,483.938,288.172,493.938,292.172,483.938,288.172,487.938" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="501.721" y1="471.938" x2="540.326" y2="471.938" style="stroke:#181818;stroke-width:1;"/><line x1="540.326" y1="471.938" x2="540.326" y2="493.938" style="stroke:#181818;stroke-width:1;"/><polygon points="536.326,483.938,540.326,493.938,544.326,483.938,540.326,487.938" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="288.172" y1="528.071" x2="288.172" y2="560.204" style="stroke:#181818;stroke-width:1;"/><line x1="288.172" y1="560.204" x2="402.249" y2="560.204" style="stroke:#181818;stroke-width:1;"/><polygon points="392.249,556.204,402.249,560.204,392.249,564.204,396.249,560.204" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="540.326" y1="542.204" x2="540.326" y2="560.204" style="stroke:#181818;stroke-width:1;"/><line x1="540.326" y1="560.204" x2="426.249" y2="560.204" style="stroke:#181818;stroke-width:1;"/><polygon points="436.249,556.204,426.249,560.204,436.249,564.204,432.249,560.204" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="414.249" y1="439.938" x2="414.249" y2="459.938" style="stroke:#181818;stroke-width:1;"/><polygon points="410.249,449.938,414.249,459.938,418.249,449.938,414.249,453.938" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="414.249" y1="572.204" x2="414.249" y2="592.204" style="stroke:#181818;stroke-width:1;"/><polygon points="410.249,582.204,414.249,592.204,418.249,582.204,414.249,586.204" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="414.249" y1="640.47" x2="414.249" y2="660.47" style="stroke:#181818;stroke-width:1;"/><polygon points="410.249,650.47,414.249,660.47,418.249,650.47,414.249,654.47" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="312.917" y1="813.001" x2="127.71" y2="813.001" style="stroke:#181818;stroke-width:1;"/><line x1="127.71" y1="813.001" x2="127.71" y2="881.911" style="stroke:#181818;stroke-width:1;"/><polygon points="123.71,871.911,127.71,881.911,131.71,871.911,127.71,875.911" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="127.71" y="846.456" fill="#000" font-size="11" textLength="85.642">title or business</text><text x="127.71" y="859.411" fill="#000" font-size="11" textLength="78.445">name is edited</text><line x1="515.581" y1="813.001" x2="682.041" y2="813.001" style="stroke:#181818;stroke-width:1;"/><line x1="682.041" y1="813.001" x2="682.041" y2="881.911" style="stroke:#181818;stroke-width:1;"/><polygon points="678.041,871.911,682.041,881.911,686.041,871.911,682.041,875.911" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;st