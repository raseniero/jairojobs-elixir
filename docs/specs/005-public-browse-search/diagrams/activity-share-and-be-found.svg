<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:2069px;height:664px;background:#FFFFFF;" width="2069px" height="664px" viewBox="0 0 2069 664" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="905.372" y="33.535" fill="#000" font-size="14" textLength="256.99" font-weight="700">Share and be found (REQ-005-8/9)</text></g><ellipse cx="812.752" cy="62.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="773.572,92.488,851.931,92.488,863.931,104.488,851.931,116.488,773.572,116.488,761.572,104.488,773.572,92.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="773.572" y="108.646" fill="#000" font-size="11" textLength="78.359">Who is asking?</text><text x="582.199" y="102.168" fill="#000" font-size="11" textLength="179.373">a visitor on a listing's public page</text><text x="863.931" y="102.168" fill="#000" font-size="11" textLength="240.577">a search engine or a chat app reading a page</text><rect x="239.461" y="126.488" width="92.779" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="249.461" y="148.09" fill="#000" font-size="12" textLength="72.779">Taps "Share"</text><path d="M376.822,195.621 L376.822,251.553 L600.572,251.553 L600.572,205.621 L590.572,195.621 L376.822,195.621" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M590.572,195.621 L590.572,205.621 L600.572,205.621 L590.572,195.621" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="382.822" y="213.189" fill="#000" font-size="13" textLength="195.349">No buttons for particular apps.</text><text x="382.822" y="228.5" fill="#000" font-size="13" textLength="202.75">Nothing is added to the address</text><text x="382.822" y="243.811" fill="#000" font-size="13" textLength="142.34">to track who shared it.</text><polygon points="206.879,251.553,364.822,251.553,376.822,263.553,364.822,275.553,206.879,275.553,194.879,263.553,206.879,251.553" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="206.879" y="267.71" fill="#000" font-size="11" textLength="157.942">The phone has a share sheet?</text><text x="177.396" y="261.232" fill="#000" font-size="11" textLength="17.483">yes</text><text x="376.822" y="261.232" fill="#000" font-size="11" textLength="13.583">no</text><rect x="16" y="285.553" width="263.41" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="307.154" fill="#000" font-size="12" textLength="243.41">Open it with the listing's title and address</text><rect x="299.41" y="285.553" width="249.172" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="309.41" y="307.154" fill="#000" font-size="12" textLength="229.172">Copy the address and say "Link copied"</text><polygon points="285.851,325.686,297.851,337.686,285.851,349.686,273.851,337.686,285.851,325.686" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="142.04" y="369.686" width="287.621" height="62.398" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="152.04" y="391.287" fill="#000" font-size="12" textLength="228.223">A friend receives the link. The chat app</text><text x="152.04" y="405.42" fill="#000" font-size="12" textLength="267.621">shows a preview: the title and business name,</text><text x="152.04" y="419.553" fill="#000" font-size="12" textLength="222.281">then the salary range, area and region</text><rect x="154.066" y="461.018" width="263.568" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="164.066" y="482.619" fill="#000" font-size="12" textLength="230.104">The friend follows the link and sees the</text><text x="164.066" y="496.752" fill="#000" font-size="12" textLength="243.568">public page with no account (REQ-005-5)</text><ellipse cx="285.851" cy="545.482" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="285.851" cy="545.482" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="1306.661,126.488,1372.645,126.488,1384.645,138.488,1372.645,150.488,1306.661,150.488,1294.661,138.488,1306.661,126.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1306.661" y="142.646" fill="#000" font-size="11" textLength="65.984">Which page?</text><rect x="620.572" y="199.354" width="322.156" height="104.797" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="630.572" y="220.955" fill="#000" font-size="12" textLength="244.424">Own page title: job title, business, region.</text><text x="630.572" y="235.088" fill="#000" font-size="12" textLength="280.623">Description: salary range, type, area and region.</text><text x="630.572" y="249.221" fill="#000" font-size="12" textLength="302.156">Job details a search engine can read: title, business,</text><text x="630.572" y="263.354" fill="#000" font-size="12" textLength="279.088">area and region, salary range in PHP per month,</text><text x="630.572" y="277.486" fill="#000" font-size="12" textLength="242.678">type, date posted (the approval), the text.</text><text x="630.572" y="291.619" fill="#000" font-size="12" textLength="222.621">No closing date: listings do not expire</text><rect x="962.729" y="212.309" width="289.344" height="76.531" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="972.729" y="233.91" fill="#000" font-size="12" textLength="269.344">Own page title: "Jobs in Davao City | jairojobs"</text><text x="972.729" y="248.043" fill="#000" font-size="12" textLength="264.029">for a region, "Jobs in the Philippines, with the</text><text x="972.729" y="262.176" fill="#000" font-size="12" textLength="258.076">salary shown | jairojobs" for the home page.</text><text x="972.729" y="276.309" fill="#000" font-size="12" textLength="183.604">Description: one plain sentence</text><rect x="1272.072" y="212.309" width="239.375" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1282.072" y="233.91" fill="#000" font-size="12" textLength="219.375">Asks not to be listed in search results</text><rect x="1531.447" y="212.309" width="234.406" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1541.447" y="233.91" fill="#000" font-size="12" textLength="214.406">Answered as "gone", so it is dropped</text><rect x="1775.854" y="212.309" width="251.51" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1785.854" y="233.91" fill="#000" font-size="12" textLength="231.51">Behind log-in, and never in the sitemap</text><polygon points="1339.653,399.15,1339.653,399.15,1351.653,411.15,1339.653,423.15,1339.653,423.15,1327.653,411.15,1339.653,399.15" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="1191.846" y="452.084" width="295.613" height="62.398" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1201.846" y="473.686" fill="#000" font-size="12" textLength="275.613">Every public page states its one address, and is</text><text x="1201.846" y="487.818" fill="#000" font-size="12" textLength="257.467">complete as first delivered: its text does not</text><text x="1201.846" y="501.951" fill="#000" font-size="12" textLength="126.176">wait for scripts to run</text><path d="M1500.707,550.57 L1500.707,566.881 L1480.707,570.881 L1500.707,574.881 L1500.707,591.191 A0,0 0 0 0 1500.707,591.191 L1747.061,591.191 A0,0 0 0 0 1747.061,591.191 L1747.061,560.57 L1737.061,550.57 L1500.707,550.57 A0,0 0 0 0 1500.707,550.57" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1737.061,550.57 L1737.061,560.57 L1747.061,560.57 L1737.061,550.57" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1506.707" y="568.139" fill="#000" font-size="13" textLength="225.354">No third-party script, tag or tracker</text><text x="1506.707" y="583.449" fill="#000" font-size="13" textLength="150.236">is added for any of this.</text><rect x="1198.599" y="539.682" width="282.107" height="62.398" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1208.599" y="561.283" fill="#000" font-size="12" textLength="262.107">The sitemap lists the home page, each active</text><text x="1208.599" y="575.416" fill="#000" font-size="12" textLength="234.551">region's jobs and each Published listing,</text><text x="1208.599" y="589.549" fill="#000" font-size="12" textLength="97.33">and nothing else</text><ellipse cx="1339.653" cy="633.08" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="1339.653" cy="633.08" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="194.879" y1="263.553" x2="147.705" y2="263.553" style="stroke:#181818;stroke-width:1;"/><line x1="147.705" y1="263.553" x2="147.705" y2="285.553" style="stroke:#181818;stroke-width:1;"/><polygon points="143.705,275.553,147.705,285.553,151.705,275.553,147.705,279.553" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="376.822" y1="263.553" x2="423.996" y2="263.553" style="stroke:#181818;stroke-width:1;"/><line x1="423.996" y1="263.553" x2="423.996" y2="285.553" style="stroke:#181818;stroke-width:1;"/><polygon points="419.996,275.553,423.996,285.553,427.996,275.553,423.996,279.553" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="147.705" y1="319.686" x2="147.705" y2="337.686" style="stroke:#181818;stroke-width:1;"/><line x1="147.705" y1="337.686" x2="273.851" y2="337.686" style="stroke:#181818;stroke-width:1;"/><polygon points="263.851,333.686,273.851,337.686,263.851,341.686,267.851,337.686" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="423.996" y1="319.686" x2="423.996" y2="337.686" style="stroke:#181818;stroke-width:1;"/><line x1="423.996" y1="337.686" x2="297.851" y2="337.686" style="stroke:#181818;stroke-width:1;"/><polygon points="307.851,333.686,297.851,337.686,307.851,341.686,303.851,337.686" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="285.851" y1="160.621" x2="285.851" y2="251.553" style="stroke:#181818;stroke-width:1;"/><polygon points="281.851,241.553,285.851,251.553,289.851,241.553,285.851,245.553" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="285.851" y1="349.686" x2="285.851" y2="369.686" style="stroke:#181818;stroke-width:1;"/><polygon points="281.851,359.686,285.851,369.686,289.851,359.686,285.851,363.686" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="285.851" y1="432.084" x2="285.851" y2="461.018" style="stroke:#181818;stroke-width:1;"/><polygon points="281.851,451.018,285.851,461.018,289.851,451.018,285.851,455.018" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="285.851" y1="509.283" x2="285.851" y2="534.482" style="stroke:#181818;stroke-width:1;"/><polygon points="281.851,524.482,285.851,534.482,289.851,524.482,285.851,528.482" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1294.661" y1="138.488" x2="781.65" y2="138.488" style="stroke:#181818;stroke-width:1;"/><line x1="781.65" y1="138.488" x2="781.65" y2="199.354" style="stroke:#181818;stroke-width:1;"/><polygon points="777.65,189.354,781.65,199.354,785.65,189.354,781.65,193.354" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="781.65" y="173.078" fill="#000" font-size="11" textLength="97.657">a Published listing</text><line x1="1384.645" y1="138.488" x2="1901.608" y2="138.488" style="stroke:#181818;stroke-width:1;"/><line x1="1901.608" y1="138.488" x2="1901.608" y2="212.309" style="stroke:#181818;stroke-width:1;"/><polygon points="1897.608,202.309,1901.608,212.309,1905.608,202.309,1901.608,206.309" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1901.608" y="173.078" fill="#000" font-size="11" textLength="147.125">a private page: Admin area,</text><text x="1901.608" y="186.033" fill="#000" font-size="11" textLength="106.971">My listings, Settings</text><line x1="1107.4" y1="138.488" x2="1107.4" y2="212.309" style="stroke:#181818;stroke-width:1;"/><polygon points="1103.4,202.309,1107.4,212.309,1111.4,202.309,1107.4,206.309" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1107.4" y="168.078" fill="#000" font-size="11" textLength="94.735">the home page or</text><text x="1107.4" y="181.033" fill="#000" font-size="11" textLength="78.047">a region's jobs</text><line x1="1339.653" y1="150.488" x2="1339.653" y2="171.095" style="stroke:#181818;stroke-width:1;"/><line x1="1339.653" y1="171.095" x2="1391.76" y2="171.095" style="stroke:#181818;stroke-width:1;"/><line x1="1391.76" y1="171.095" x2="1391.76" y2="212.309" style="stroke:#181818;stroke-width:1;"/><polygon points="1387.76,202.309,1391.76,212.309,1395.76,202.309,1391.76,206.309" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1339.653" y="174.078" fill="#000" font-size="11" textLength="89.966">a list with search</text><text x="