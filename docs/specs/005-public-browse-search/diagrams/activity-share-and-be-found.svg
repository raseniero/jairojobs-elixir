<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1964px;height:660px;background:#FFFFFF;" width="1964px" height="660px" viewBox="0 0 1964 660" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="852.633" y="33.535" fill="#000" font-size="14" textLength="256.99" font-weight="700">Share and be found (REQ-005-8/9)</text></g><ellipse cx="777.007" cy="62.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="737.828,92.488,816.187,92.488,828.187,104.488,816.187,116.488,737.828,116.488,725.828,104.488,737.828,92.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="737.828" y="108.646" fill="#000" font-size="11" textLength="78.359">Who is asking?</text><text x="546.455" y="102.168" fill="#000" font-size="11" textLength="179.373">a visitor on a listing's public page</text><text x="828.187" y="102.168" fill="#000" font-size="11" textLength="240.577">a search engine or a chat app reading a page</text><rect x="239.461" y="126.488" width="92.779" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="249.461" y="148.09" fill="#000" font-size="12" textLength="72.779">Taps "Share"</text><polygon points="206.879,195.621,364.822,195.621,376.822,207.621,364.822,219.621,206.879,219.621,194.879,207.621,206.879,195.621" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="206.879" y="211.778" fill="#000" font-size="11" textLength="157.942">The phone has a share sheet?</text><text x="177.396" y="205.301" fill="#000" font-size="11" textLength="17.483">yes</text><text x="376.822" y="205.301" fill="#000" font-size="11" textLength="13.583">no</text><rect x="16" y="229.621" width="263.41" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="251.223" fill="#000" font-size="12" textLength="243.41">Open it with the listing's title and address</text><rect x="299.41" y="229.621" width="249.172" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="309.41" y="251.223" fill="#000" font-size="12" textLength="229.172">Copy the address and say "Link copied"</text><polygon points="285.851,269.754,297.851,281.754,285.851,293.754,273.851,281.754,285.851,269.754" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="142.04" y="313.754" width="287.621" height="62.398" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="152.04" y="335.355" fill="#000" font-size="12" textLength="228.223">A friend receives the link. The chat app</text><text x="152.04" y="349.488" fill="#000" font-size="12" textLength="267.621">shows a preview: the title and business name,</text><text x="152.04" y="363.621" fill="#000" font-size="12" textLength="222.281">then the salary range, area and region</text><rect x="154.066" y="411.152" width="263.568" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="164.066" y="432.754" fill="#000" font-size="12" textLength="230.104">The friend follows the link and sees the</text><text x="164.066" y="446.887" fill="#000" font-size="12" textLength="243.568">public page with no account (REQ-005-5)</text><ellipse cx="285.851" cy="505.418" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="285.851" cy="505.418" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="1235.172,126.488,1301.156,126.488,1313.156,138.488,1301.156,150.488,1235.172,150.488,1223.172,138.488,1235.172,126.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1235.172" y="142.646" fill="#000" font-size="11" textLength="65.984">Which page?</text><rect x="578.582" y="199.354" width="322.156" height="90.664" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="588.582" y="220.955" fill="#000" font-size="12" textLength="244.424">Own page title: job title, business, region.</text><text x="588.582" y="235.088" fill="#000" font-size="12" textLength="280.623">Description: salary range, type, area and region.</text><text x="588.582" y="249.221" fill="#000" font-size="12" textLength="302.156">Job details a search engine can read: title, business,</text><text x="588.582" y="263.354" fill="#000" font-size="12" textLength="279.088">area and region, salary range in PHP per month,</text><text x="588.582" y="277.486" fill="#000" font-size="12" textLength="154.541">type, date posted, the text</text><rect x="920.738" y="212.309" width="230.346" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="930.738" y="233.91" fill="#000" font-size="12" textLength="210.346">Own page title: "Jobs in Davao City".</text><text x="930.738" y="248.043" fill="#000" font-size="12" textLength="183.604">Description: one plain sentence</text><rect x="1171.084" y="212.309" width="239.375" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1181.084" y="233.91" fill="#000" font-size="12" textLength="219.375">Asks not to be listed in search results</text><rect x="1425.97" y="212.309" width="234.406" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1435.97" y="233.91" fill="#000" font-size="12" textLength="214.406">Answered as "gone", so it is dropped</text><rect x="1670.376" y="212.309" width="251.51" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1680.376" y="233.91" fill="#000" font-size="12" textLength="231.51">Behind log-in, and never in the sitemap</text><polygon points="1268.164,385.018,1268.164,385.018,1280.164,397.018,1268.164,409.018,1268.164,409.018,1256.164,397.018,1268.164,385.018" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="1120.357" y="444.018" width="295.613" height="62.398" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1130.357" y="465.619" fill="#000" font-size="12" textLength="275.613">Every public page states its one address, and is</text><text x="1130.357" y="479.752" fill="#000" font-size="12" textLength="257.467">complete as first delivered: its text does not</text><text x="1130.357" y="493.885" fill="#000" font-size="12" textLength="126.176">wait for scripts to run</text><rect x="1127.11" y="536.418" width="282.107" height="62.398" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1137.11" y="558.02" fill="#000" font-size="12" textLength="262.107">The sitemap lists the home page, each active</text><text x="1137.11" y="572.152" fill="#000" font-size="12" textLength="234.551">region's jobs and each Published listing,</text><text x="1137.11" y="586.285" fill="#000" font-size="12" textLength="97.33">and nothing else</text><ellipse cx="1268.164" cy="629.816" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="1268.164" cy="629.816" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="194.879" y1="207.621" x2="147.705" y2="207.621" style="stroke:#181818;stroke-width:1;"/><line x1="147.705" y1="207.621" x2="147.705" y2="229.621" style="stroke:#181818;stroke-width:1;"/><polygon points="143.705,219.621,147.705,229.621,151.705,219.621,147.705,223.621" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="376.822" y1="207.621" x2="423.996" y2="207.621" style="stroke:#181818;stroke-width:1;"/><line x1="423.996" y1="207.621" x2="423.996" y2="229.621" style="stroke:#181818;stroke-width:1;"/><polygon points="419.996,219.621,423.996,229.621,427.996,219.621,423.996,223.621" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="147.705" y1="263.754" x2="147.705" y2="281.754" style="stroke:#181818;stroke-width:1;"/><line x1="147.705" y1="281.754" x2="273.851" y2="281.754" style="stroke:#181818;stroke-width:1;"/><polygon points="263.851,277.754,273.851,281.754,263.851,285.754,267.851,281.754" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="423.996" y1="263.754" x2="423.996" y2="281.754" style="stroke:#181818;stroke-width:1;"/><line x1="423.996" y1="281.754" x2="297.851" y2="281.754" style="stroke:#181818;stroke-width:1;"/><polygon points="307.851,277.754,297.851,281.754,307.851,285.754,303.851,281.754" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="285.851" y1="160.621" x2="285.851" y2="195.621" style="stroke:#181818;stroke-width:1;"/><polygon points="281.851,185.621,285.851,195.621,289.851,185.621,285.851,189.621" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="285.851" y1="293.754" x2="285.851" y2="313.754" style="stroke:#181818;stroke-width:1;"/><polygon points="281.851,303.754,285.851,313.754,289.851,303.754,285.851,307.754" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="285.851" y1="376.152" x2="285.851" y2="411.152" style="stroke:#181818;stroke-width:1;"/><polygon points="281.851,401.152,285.851,411.152,289.851,401.152,285.851,405.152" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="285.851" y1="459.418" x2="285.851" y2="494.418" style="stroke:#181818;stroke-width:1;"/><polygon points="281.851,484.418,285.851,