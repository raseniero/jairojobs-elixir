<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:2275px;height:681px;background:#FFFFFF;" width="2275px" height="681px" viewBox="0 0 2275 681" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="1008.027" y="33.535" fill="#000" font-size="14" textLength="256.99" font-weight="700">Share and be found (REQ-005-8/9)</text></g><ellipse cx="859.079" cy="62.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="819.9,92.488,898.259,92.488,910.259,104.488,898.259,116.488,819.9,116.488,807.9,104.488,819.9,92.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="819.9" y="108.646" fill="#000" font-size="11" textLength="78.359">Who is asking?</text><text x="628.527" y="102.168" fill="#000" font-size="11" textLength="179.373">a visitor on a listing's public page</text><text x="910.259" y="102.168" fill="#000" font-size="11" textLength="240.577">a search engine or a chat app reading a page</text><rect x="239.461" y="126.488" width="92.779" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="249.461" y="148.09" fill="#000" font-size="12" textLength="72.779">Taps "Share"</text><path d="M376.822,195.621 L376.822,251.553 L600.572,251.553 L600.572,205.621 L590.572,195.621 L376.822,195.621" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M590.572,195.621 L590.572,205.621 L600.572,205.621 L590.572,195.621" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="382.822" y="213.189" fill="#000" font-size="13" textLength="195.349">No buttons for particular apps.</text><text x="382.822" y="228.5" fill="#000" font-size="13" textLength="202.75">Nothing is added to the address</text><text x="382.822" y="243.811" fill="#000" font-size="13" textLength="142.34">to track who shared it.</text><polygon points="206.879,251.553,364.822,251.553,376.822,263.553,364.822,275.553,206.879,275.553,194.879,263.553,206.879,251.553" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="206.879" y="267.71" fill="#000" font-size="11" textLength="157.942">The phone has a share sheet?</text><text x="177.396" y="261.232" fill="#000" font-size="11" textLength="17.483">yes</text><text x="376.822" y="261.232" fill="#000" font-size="11" textLength="13.583">no</text><rect x="16" y="285.553" width="263.41" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="307.154" fill="#000" font-size="12" textLength="243.41">Open it with the listing's title and address</text><rect x="299.41" y="285.553" width="249.172" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="309.41" y="307.154" fill="#000" font-size="12" textLength="229.172">Copy the address and say "Link copied"</text><polygon points="285.851,325.686,297.851,337.686,285.851,349.686,273.851,337.686,285.851,325.686" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="142.04" y="369.686" width="287.621" height="62.398" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="152.04" y="391.287" fill="#000" font-size="12" textLength="228.223">A friend receives the link. The chat app</text><text x="152.04" y="405.42" fill="#000" font-size="12" textLength="267.621">shows a preview: the title and business name,</text><text x="152.04" y="419.553" fill="#000" font-size="12" textLength="222.281">then the salary range, area and region</text><rect x="154.066" y="456.105" width="263.568" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="164.066" y="477.707" fill="#000" font-size="12" textLength="230.104">The friend follows the link and sees the</text><text x="164.066" y="491.84" fill="#000" font-size="12" textLength="243.568">public page with no account (REQ-005-5)</text><ellipse cx="285.851" cy="550.371" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="285.851" cy="550.371" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="1399.316,126.488,1465.3,126.488,1477.3,138.488,1465.3,150.488,1399.316,150.488,1387.316,138.488,1399.316,126.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1399.316" y="142.646" fill="#000" font-size="11" textLength="65.984">Which page?</text><rect x="610.572" y="212.309" width="322.156" height="104.797" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="620.572" y="233.91" fill="#000" font-size="12" textLength="244.424">Own page title: job title, business, region.</text><text x="620.572" y="248.043" fill="#000" font-size="12" textLength="280.623">Description: salary range, type, area and region.</text><text x="620.572" y="262.176" fill="#000" font-size="12" textLength="302.156">Job details a search engine can read: title, business,</text><text x="620.572" y="276.309" fill="#000" font-size="12" textLength="279.088">area and region, salary range in PHP per month,</text><text x="620.572" y="290.441" fill="#000" font-size="12" textLength="242.678">type, date posted (the approval), the text.</text><text x="620.572" y="304.574" fill="#000" font-size="12" textLength="222.621">No closing date: listings do not expire</text><rect x="952.729" y="225.264" width="289.344" height="76.531" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="962.729" y="246.865" fill="#000" font-size="12" textLength="269.344">Own page title: "Jobs in Davao City | jairojobs"</text><text x="962.729" y="260.998" fill="#000" font-size="12" textLength="264.029">for a region, "Jobs in the Philippines, with the</text><text x="962.729" y="275.131" fill="#000" font-size="12" textLength="258.076">salary shown | jairojobs" for the home page.</text><text x="962.729" y="289.264" fill="#000" font-size="12" textLength="183.604">Description: one plain sentence</text><path d="M1511.447,238.219 L1511.447,254.529 L1491.447,258.529 L1511.447,262.529 L1511.447,278.84 A0,0 0 0 0 1511.447,278.84 L1716.758,278.84 A0,0 0 0 0 1716.758,278.84 L1716.758,248.219 L1706.758,238.219 L1511.447,238.219 A0,0 0 0 0 1511.447,238.219" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1706.758,238.219 L1706.758,248.219 L1716.758,248.219 L1706.758,238.219" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1517.447" y="255.787" fill="#000" font-size="13" textLength="184.311">A hidden region's listings are</text><text x="1517.447" y="271.098" fill="#000" font-size="13" textLength="145.844">treated like any others.</text><rect x="1252.072" y="241.463" width="239.375" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1262.072" y="263.064" fill="#000" font-size="12" textLength="219.375">Asks not to be listed in search results</text><rect x="1736.758" y="225.264" width="234.406" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1746.758" y="246.865" fill="#000" font-size="12" textLength="214.406">Answered as "gone", so it is dropped</text><rect x="1981.164" y="225.264" width="251.51" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1991.164" y="246.865" fill="#000" font-size="12" textLength="231.51">Behind log-in, and never in the sitemap</text><polygon points="1432.308,412.105,1432.308,412.105,1444.308,424.105,1432.308,436.105,1432.308,436.105,1420.308,424.105,1432.308,412.105" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="1284.501" y="460.127" width="295.613" height="62.398" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1294.501" y="481.729" fill="#000" font-size="12" textLength="275.613">Every public page states its one address, and is</text><text x="1294.501" y="495.861" fill="#000" font-size="12" textLength="257.467">complete as first delivered: its text does not</text><text x="1294.501" y="509.994" fill="#000" font-size="12" textLength="126.176">wait for scripts to run</text><path d="M1593.362,568.414 L1593.362,584.725 L1573.362,588.725 L1593.362,592.725 L1593.362,609.035 A0,0 0 0 0 1593.362,609.035 L1839.716,609.035 A0,0 0 0 0 1839.716,609.035 L1839.716,578.414 L1829.716,568.414 L1593.362,568.414 A0,0 0 0 0 1593.362,568.414" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1829.716,568.414 L1829.716,578.414 L1839.716,578.414 L1829.716,568.414" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1599.362" y="585.982" fill="#000" font-size="13" textLength="225.354">No third-party script, tag or tracker</text><text x="1599.362" y="601.293" fill="#000" font-size="13" textLength="150.236">is added for any of this.</text><rect x="1291.254" y="557.525" width="282.107" height="62.398" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1301.254" y="579.127" fill="#000" font-size="12" textLength="262.107">The sitemap lists the home page, each active</text><text x="1301.254" y="593.26" fill="#000" font-size="12" textLength="234.551">region's jobs and each Published listing,</text><text x="1301.254" y="607.393" fill="#000" font-size="12" textLength="97.33">and nothing else</text><ellipse cx="1432.308" cy="650.924" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="1432.308" cy="650.924" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="194.879" y1="263.553" x2="147.705" y2="263.553" style="stroke:#181818;stroke-width:1;"/><line x1="147.705" y1="263.553" x2="147.705" y2="285.553" style="stroke:#181818;stroke-width:1;"/><polygon points="143.705,275.553,147.705,285.553,151.705,275.553,147.705,279.553" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="376.822" y1="263.553" x2="423.996" y2="263.553" style="stroke:#181818;stroke-width:1;"/><line x1="423.996" y1="263.553" x2="423.996" y2="285.553" style="stroke:#181818;stroke-width:1;"/><polygon points="419.996,275.553,423.996,285.553,427.996,275.553,423.996,279.553" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="147.705" y1="319.686" x2="147.705" y2="337.686" style="stroke:#181818;stroke-width:1;"/><line x1="147.705" y1="337.686" x2="273.851" y2="337.686" style="stroke:#181818;stroke-width:1;"/><polygon points="263.851,333.686,273.851,337.686,263.851,341.686,267.851,337.686" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="423.996" y1="319.686" x2="423.996" y2="337.686" style="stroke:#181818;stroke-width:1;"/><line x1="423.996" y1="337.686" x2="297.851" y2="337.686" style="stroke:#181818;stroke-width:1;"/><polygon points="307.851,333.686,297.851,337.686,307.851,341.686,303.851,337.686" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="285.851" y1="160.621" x2="285.851" y2="251.553" style="stroke:#181818;stroke-width:1;"/><polygon points="281.851,241.553,285.851,251.553,289.851,241.553,285.851,245.553" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="285.851" y1="349.686" x2="285.851" y2="369.686" style="stroke:#181818;stroke-width:1;"/><polygon points="281.851,359.686,285.851,369.686,289.851,359.686,285.851,363.686" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="285.851" y1="432.084" x2="285.851" y2="456.105" style="stroke:#181818;stroke-width:1;"/><polygon points="281.851,446.105,285.851,456.105,289.851,446.105,285.851,450.105" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="285.851" y1="504.371" x2="285.851" y2="539.371" style="stroke:#181818;stroke-width:1;"/><polygon points="281.851,529.371,285.851,539.371,289.851,529.371,285.851,533.371" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1387.316" y1="138.488" x2="771.65" y2="138.488" style="stroke:#181818;stroke-width:1;"/><line x1="771.65" y1="138.488" x2="771.65" y2="212.309" style="stroke:#181818;stroke-width:1;"/><polygon points="767.65,202.309,771.65,212.309,775.65,202.309,771.65,206.309" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="771.65" y="179.556" fill="#000" font-size="11" textLength="97.657">a Published listing</text><line x1="1477.3" y1="138.488" x2="2106.919" y2="138.488" style="stroke:#181818;stroke-width:1;"/><line x1="2106.919" y1="138.488" x2="2106.919" y2="225.264" style="stroke:#181818;stroke-width:1;"/><polygon points="2102.919,215.264,2106.919,225.264,2110.919,215.264,2106.919,219.264" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="2106.919" y="179.556" fill="#000" font-size="11" textLength="147.125">a private page: Admin area,</text><text x="2106.919" y="192.511" fill="#000" font-size="11" textLength="106.971">My listings, Settings</text><line x1="1097.4" y1="138.488" x2="1097.4" y2="225.264" style="stroke:#181818;stroke-width:1;"/><polygon points="1093.4,215.264,1097.4,225.264,1101.4,215.264,1097.4,219.264" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1097.4" y="174.556" fill="#000" font-size="11" textLength="94.735">the home page or</text><text x="10