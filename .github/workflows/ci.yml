name: CI

# Constitution §3.9: CI is the referee — runs `mix precommit` on every push and PR.
# Constitution §3.10: runs only for product code — docs-only changes are skipped.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "scratchpad/**"
      - "**/*.md"
      - ".github/**"
      - "!.github/workflows/ci.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "scratchpad/**"
      - "**/*.md"
      - ".github/**"
      - "!.github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.5"
  OTP_VERSION: "29"

jobs:
  precommit:
    name: mix precommit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jairojobs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get --only test

      - name: mix precommit
        # compile --warnings-as-errors, deps.unlock --unused, format, test
        run: mix precommit

      - name: Check formatting left no diff
        run: git diff --exit-code
